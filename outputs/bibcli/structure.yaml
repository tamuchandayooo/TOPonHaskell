type: Project
name: BibTeXLibrary
description: A Haskell project to manage personal BibTEX entries, persisting them in a file named library.bib.
children:
  - type: Directory
    name: app
    description: The executable entry point for the program.
    children:
      - type: Module
        name: Main
        description: Contains the main function to handle command-line arguments and invoke the appropriate logic.
        children: []
  - type: Directory
    name: src
    description: Contains the source code of the program, organized into modules according to their responsibilities.
    children:
      - type: Module
        name: BibTeXLibrary
        description: Contains the core logic for managing BibTEX entries, including reading, writing, and searching.
        children:
          - type: Type
            name: BibTeXEntry
            description: Represents a BibTEX entry, including its content, authors, and other relevant fields.
          - type: Method
            name: saveEntry
            description: Saves a BibTEX entry to the library.bib file.
            typeSignature: "BibTeXEntry -> IO ()"
          - type: Method
            name: listEntries
            description: Lists all BibTEX entries saved in the library.bib file.
            typeSignature: "IO [BibTeXEntry]"
          - type: Method
            name: searchEntries
            description: Searches for BibTEX entries containing a specific word.
            typeSignature: "String -> IO [BibTeXEntry]"