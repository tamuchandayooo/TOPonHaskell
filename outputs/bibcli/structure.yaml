type: Project
name: BibTeXLibrary
description: A Haskell project to manage a personal library of BibTEX entries.
children:
  - type: Directory
    name: app
    description: Contains the executable entry point for the program.
    children:
      - type: Module
        name: Main
        description: Initializes the BibTeX library and handles command-line arguments to list, add, or search entries.
        children: []
  - type: Directory
    name: src
    description: Contains the domain logic and data structures of the program.
    children:
      - type: Module
        name: BibTeXLibrary
        description: Manages BibTEX entries, including saving, listing, and searching.
        children:
          - type: Type
            name: BibTeXEntry
            description: Represents a BibTEX entry with fields such as key, title, author, year, and abstract.
          - type: Method
            name: saveEntry
            description: Saves a BibTEX entry to the library.bib file.
            typeSignature: "saveEntry :: BibTeXEntry -> IO ()"
          - type: Method
            name: listEntries
            description: Lists all saved BibTEX entries from the library.bib file.
            typeSignature: "listEntries :: IO [BibTeXEntry]"
          - type: Method
            name: searchEntries
            description: Searches for BibTEX entries that contain a specific word in their content.
            typeSignature: "searchEntries :: String -> IO [BibTeXEntry]"